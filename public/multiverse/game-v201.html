let E=[],B=[],F=[],r=1,hit=0,clear=0,bg,now=performance.now(),sum=+(localStorage.mvsum||0);const P={x:48,y:244,w:46,h:70,vx:0,vy:0,dir:1,j:0,hp:168,max:168,atk:24,lv:1,xp:0,pow:1,cd:0,dash:0,inv:0};const R=[['SẢNH BỊ LÃNG QUÊN','ruin',['slime','slime','skel']],['HANG NẤM','cave',['slime','arch','slime']],['HÀNH LANG XƯƠNG','crypt',['skel','skel','arch']],['ĐƯỜNG HẦM GOBLIN','gob',['gob','goba','mage']],['LÒ RÈN GOLEM','forge',['golem','gob']],['KHO BÁU BỊ NGUYỀN','wraith',['wraith']]];function q(x,y,w,h,k){X.fillStyle=k;X.fillRect(x|0,y|0,w|0,h|0)}function pc(cx,cy,z,k){X.fillStyle=k;for(let y=-z;y<=z;y++)for(let x=-z;x<=z;x++)if(x*x+y*y<=z*z)X.fillRect(cx+x,cy+y,1,1)}function mkbg(theme){

function room(){E=[],B=[],F=[],hit=clear=0,P.x=48,P.y=G-P.h,P.vy=0,P.j=0,P.inv=500;let d=R[(r-1)%6];bg=mkbg(d[1]);txt('PHÒNG '+r+' · '+d[0],'#8fffe0',900);ui()}function spawn(){if(hit)return;hit=1;let d=R[(r-1)%6],sc=1+(r-1)*.05;d[2].forEach((t,i)=>{let m={slime:[42,32,55],skel:[48,68,100],arch:[48,68,85],gob:[50,68,108],goba:[50,68,88],mage:[50,70,98],golem:[68,94,340],wraith:[80,100,700]}[t];E.push({t,x:350+i*95,y:G-m[1],w:m[0],h:m[1],hp:m[2]*sc,max:m[2]*sc,cd:500+Math.random()*600,vx:0})});txt(d[2].length===1?'BOSS ROOM':'QUÁI VẬT XUẤT HIỆN','#ffd36d',650)}function txt(v,k,l){F.push({t:'txt',v,k,l,x:W/2,y:70})}function box(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function dmg(e,d,k=0){e.hp-=d*P.pow;e.vx+=k;F.push({t:'num',v:Math.round(d*P.pow),x:e.x+e.w/2,y:e.y-4,l:400});if(e.hp<=0){P.xp+=e.t==='wraith'?160:e.t==='golem'?70:18;if(e.t==='wraith'){sum++;localStorage.mvsum=sum}if(P.xp>=80+(P.lv-1)*55){P.xp=0;P.lv++;P.pow=1+(P.lv-1)*.08;P.max+=10;P.hp=Math.min(P.max,P.hp+60);txt('LEVEL UP · '+P.lv,'#ffe76a',800)}}}function basic(){if(P.cd>0)return;P.cd=190;let a={x:P.dir>0?P.x+P.w:P.x-70,y:P.y+5,w:70,h:60};E.forEach(e=>{if(box(a,e))dmg(e,P.atk,P.dir*3)});F.push({t:'slash',x:P.x+P.w/2+P.dir*25,y:P.y+34,l:170,d:P.dir})}function skill(n){if(n===1){E.forEach(e=>{if(Math.abs(e.x-P.x)<130)dmg(e,P.atk*2,P.dir*6)});F.push({t:'ring',x:P.x+23,y:P.y+35,l:250,r:24})}if(n===2){P.x=Math.max(5,Math.min(W-P.w-5,P.x+P.dir*105));P.inv=450}if(n===3){E.forEach(e=>{if(Math.hypot(e.x-P.x,e.y-P.y)<190)dmg(e,P.atk*2.8,Math.sign(e.x-P.x)*8)});F.push({t:'ring',x:P.x+23,y:P.y+35,l:450,r:85})}}function sprite(key,cx,bottom,height,dir=1,alpha=1){

function upd(dt){P.cd=Math.max(0,P.cd-dt);P.inv=Math.max(0,P.inv-dt);let m=(K.d||K.arrowright?1:0)-(K.a||K.arrowleft?1:0);P.vx=m*2.6;if(m)P.dir=Math.sign(m);if(K.k&&P.dash<=0){P.x+=P.dir*65;P.dash=650;P.inv=220}P.dash=Math.max(0,P.dash-dt);P.vy+=.032*dt;P.x=Math.max(5,Math.min(W-P.w-5,P.x+P.vx*dt/16.7));P.y+=P.vy*dt/16.7;if(P.y+P.h>=G){P.y=G-P.h;P.vy=0;P.j=0}if(!hit&&P.x>205)spawn();if(hit&&!clear&&E.length===0){clear=1;P.hp=Math.min(P.max,P.hp+15);txt('DỌN SẠCH · ĐI TỚI CỔNG →','#8fffd4',900)}if(hit&&!clear)P.x=Math.min(P.x,W-P.w-70);if(clear&&P.x>585){r++;room()}E.forEach(e=>{e.cd-=dt;if(Math.abs(e.vx)>.05){e.x+=e.vx*dt/16.7;e.vx*=.88}else{let d=Math.sign(P.x-e.x)||1;if(e.t==='arch'||e.t==='goba'||e.t==='mage'){if(Math.abs(P.x-e.x)<130)e.x-=d*.7;else if(Math.abs(P.x-e.x)>240)e.x+=d*.5;if(e.cd<=0){e.cd=900+Math.random()*500;B.push({x:e.x+e.w/2,y:e.y+25,vx:d*3,r:4,d:e.t==='mage'?12:9,p:0})}}else e.x+=d*(e.t==='golem'?.42:e.t==='wraith'?.9:.65)*dt/16.7}if(box(P,e)&&P.inv<=0){P.hp-=e.t==='wraith'?22:e.t==='golem'?18:10;P.inv=600}});E=E.filter(e=>e.hp>0);B.forEach(b=>{b.x+=b.vx*dt/16.7;if(!b.p&&P.inv<=0&&b.x>P.x&&b.x<P.x+P.w&&b.y>P.y&&b.y<P.y+P.h){P.hp-=b.d;P.inv=500;b.z=1}});B=B.filter(b=>!b.z&&b.x>0&&b.x<W);F.forEach(f=>{f.l-=dt;if(f.t==='num')f.y-=.02*dt});F=F.filter(f=>f.l>0);if(P.hp<=0){P.hp=P.max;r=1;room()}ui()}function draw(){X.drawImage(bg,0,0);E.forEach(mob);B.forEach(b=>pc(b.x|0,b.y|0,b.r,'#d9cda1'));knight();F.forEach(f=>{if(f.t==='txt'||f.t==='num'){X.fillStyle=f.k||'#fff';X.font='700 '+(f.t==='txt'?13:9)+'px monospace';X.textAlign='center';X.fillText(f.v,f.x,f.y)}else{X.strokeStyle='#6ee9ff';X.lineWidth=2;X.beginPath();X.arc(f.x,f.y,f.r||18,0,7);X.stroke()}});if(!hit){X.fillStyle='#dffcff';X.fillText('ĐI SÂU HƠN →',120,165)}if(clear){X.strokeStyle='#7fffe0';X.lineWidth=3;X.beginPath();X.ellipse(590,G-44,12,27,0,0,7);X.stroke()}}function ui(){hp.textContent='HP '+Math.ceil(P.hp)+'/'+P.max;lv.textContent='LV '+P.lv+' · ATK×'+P.pow.toFixed(2)+' · SUM '+sum;let d=R[(r-1)%6];rm.textContent='TẦNG '+(1+Math.floor((r-1)/6))+' · PHÒNG '+r+' · '+d[0]}function jump(){if(P.j<2){P.vy=-7.9*(P.j?.92:1);P.j++}}addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(!K[k]&&(k===' '||k==='w'||k==='arrowup'))jump();if(!K[k]&&k==='1')skill(1);if(!K[k]&&k==='2')skill(2);if(!K[k]&&k==='3')skill(3);K[k]=1});addEventListener('keyup',e=>K[e.key.toLowerCase()]=0);C.addEventListener('pointerdown',e=>{if(e.button===0)basic()});function loop(t){let d=Math.min(32,t-now);now=t;upd(d);draw();requestAnimationFrame(loop)}preloadArt().then(()=>{document.getElementById('loading').remove();now=performance.now();room();requestAnimationFrame(loop)}).catch(err=>{console.error(err);document.getElementById('loading').textContent='Không tải được đồ họa. Vui lòng tải lại trang.'})})()</script></body></html>
