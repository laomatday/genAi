<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loading Multiverse v3.00</title><style>html,body{margin:0;height:100%;display:grid;place-items:center;background:#02070b;color:#9ee9e4;font:14px ui-monospace,monospace}</style><div>Đang tải Dungeon Expedition v3.00…</div><script>(async()=>{try{const urls=Array.from({length:8},(_,i)=>'/multiverse/v300/part-'+String(i+1).padStart(2,'0')+'.txt?v=300');const parts=[];for(const u of urls){const r=await fetch(u);if(!r.ok)throw new Error(u);parts.push(await r.text())}document.open();document.write(parts.join(''));document.close()}catch(e){document.body.innerHTML='<div>Lỗi tải game v3.00. Hãy reload trang.</div>';console.error(e)}})();</script>
