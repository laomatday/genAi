<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loading Multiverse v3.01</title><style>html,body{margin:0;height:100%;display:grid;place-items:center;background:#02070b;color:#9ee9e4;font:14px ui-monospace,monospace}</style><div>Đang tải Dungeon Expedition v3.01…</div><script>(async()=>{try{const urls=Array.from({length:8},(_,i)=>'/multiverse/v300/part-'+String(i+1).padStart(2,'0')+'.txt?v=301');const parts=[];for(const u of urls){const r=await fetch(u);if(!r.ok)throw new Error(u);parts.push(await r.text())}let src=parts.join('');const old=`function drawPlatforms(){X.fillStyle='#17383d';for(const p of room.platforms){const x=p.x-cam;if(x>-p.w&&x<W){X.fillRect(x,p.y,p.w,p.h);X.fillStyle='#29595c';X.fillRect(x,p.y,p.w,4);X.fillStyle='#17383d'}}}`;const neo=`const PLATFORM_CACHE=new Map();
function dragonPlatformTexture(w){const key=Math.max(64,Math.round(w/8)*8);if(PLATFORM_CACHE.has(key))return PLATFORM_CACHE.get(key);const c=document.createElement('canvas');c.width=key;c.height=58;const g=c.getContext('2d');g.imageSmoothingEnabled=false;const W0=key;g.fillStyle='#071a20';g.fillRect(0,0,W0,58);g.fillStyle='#163c42';g.fillRect(2,5,W0-4,50);g.fillStyle='#2d676b';g.fillRect(0,0,W0,7);g.fillStyle='#4e9291';g.fillRect(3,0,W0-6,3);g.fillStyle='#102d33';g.fillRect(0,9,W0,5);g.fillStyle='#0a2026';g.fillRect(0,52,W0,6);
// top stone blocks

// dragon scales across the relief
for(let yy=20;yy<46;yy+=7){for(let xx=(yy%14?18:11);xx<W0-8;xx+=12){g.strokeStyle='#2b6164';g.lineWidth=2;g.beginPath();g.arc(xx,yy,5,Math.PI,Math.PI*2);g.stroke();g.strokeStyle='#0b252b';g.lineWidth=1;g.beginPath();g.arc(xx,yy+1,4,Math.PI,Math.PI*2);g.stroke()}}
// rolling cloud curls
for(let x=70;x<W0-15;x+=64){g.strokeStyle='#4b8381';g.lineWidth=3;g.beginPath();g.arc(x,29,8,0.3,Math.PI*2.2);g.stroke();g.beginPath();g.arc(x+17,36,6,0,Math.PI*1.8);g.stroke();g.fillStyle='#1a4246';g.fillRect(x-9,39,34,3)}
// stylised dragon head on wider platforms
if(W0>105){const ox=12,oy=18;g.fillStyle='#1b464a';g.fillRect(ox+3,oy+8,27,14);g.fillRect(ox+18,oy+3,17,11);g.fillStyle='#4b8583';g.fillRect(ox+7,oy+6,18,3);g.fillRect(ox+25,oy+1,11,3);g.fillStyle='#07171c';g.fillRect(ox+27,oy+7,4,4);g.fillStyle='#7de0d3';g.fillRect(ox+28,oy+7,2,2);g.fillStyle='#0a2026';g.fillRect(ox,oy+15,10,5);g.fillRect(ox+7,oy+22,21,3);g.strokeStyle='#4a817f';g.lineWidth=3;g.beginPath();g.moveTo(ox+30,oy+3);g.quadraticCurveTo(ox+45,oy-8,ox+50,oy+5);g.stroke();g.beginPath();g.moveTo(ox+29,oy+19);g.quadraticCurveTo(ox+43,oy+29,ox+55,oy+18);g.stroke()}

for(let x=6;x<W0;x+=48){g.fillStyle='#0a242a';g.fillRect(x,10,2,41);if((x/48)%2<1){g.fillStyle='#315f50';g.fillRect(x+7,50,3,6);g.fillRect(x+11,51,2,4)}}g.strokeStyle='#3c7473';g.strokeRect(.5,.5,W0-1,56);PLATFORM_CACHE.set(key,c);return c}
